      <label>Name</label>

      <label>Email</label>
      <input type="email" name="email" required>

      <label>Phone Number</label>
      <input type="tel" name="phone" required>

      <label>Products</label>
      <textarea name="products" placeholder="List the items you want..." required></textarea>

      <button type="submit">Submit Order</button> <!-- I wanna change the colours of these buttons like (green submit -->
